{% load static %}<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Distribuidor de Protocolos{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --tinta: #1E2A38;
            --tinta-forte: #141E29;
            --papel: #EDF0EC;
            --papel-elevado: #FFFFFF;
            --linha: #D8DBD2;
            --carimbo: #A6763A;
            --carimbo-fundo: #F3EADC;
            --erro: #8B3A2E;
            --erro-fundo: #F5E7E4;
            --sucesso: #2F6E52;
            --sucesso-fundo: #E4EEE8;
            --texto: #1E2A38;
            --texto-suave: #5B6472;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--papel);
            color: var(--texto);
            font-family: "Work Sans", system-ui, sans-serif;
            font-size: 16px;
            line-height: 1.5;
        }

        h1, h2 {
            font-family: "Source Serif 4", Georgia, serif;
            font-weight: 600;
            color: var(--tinta);
            margin: 0 0 1rem;
        }

        h1 { font-size: 1.5rem; }
        h2 { font-size: 1.15rem; }

        a { color: var(--tinta); }

        header {
            background: var(--tinta);
            color: var(--papel);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        header .marca {
            font-family: "Source Serif 4", Georgia, serif;
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        header nav {
            display: flex;
            gap: 1.25rem;
            flex-wrap: wrap;
        }

        header nav a {
            color: var(--papel);
            text-decoration: none;
            opacity: 0.85;
        }

        header nav a:hover,
        header nav a:focus-visible {
            opacity: 1;
            text-decoration: underline;
        }

        main {
            max-width: 840px;
            margin: 0 auto;
            padding: 1.5rem 1.25rem 3rem;
        }

        section {
            margin-bottom: 2rem;
        }

        .mensagem {
            border-left: 3px solid var(--texto-suave);
            background: var(--papel-elevado);
            padding: 0.75rem 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .mensagem.success {
            border-left-color: var(--carimbo);
            background: var(--carimbo-fundo);
            color: var(--tinta);
        }

        .mensagem.success strong {
            font-family: "Source Serif 4", Georgia, serif;
        }

        .mensagem.error {
            border-left-color: var(--erro);
            background: var(--erro-fundo);
            color: var(--erro);
        }

        .tabela-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        th, td {
            text-align: left;
            padding: 0.6rem 0.75rem;
            border-bottom: 1px solid var(--linha);
            white-space: nowrap;
        }

        th {
            color: var(--texto-suave);
            font-weight: 500;
            font-size: 0.85rem;
        }

        td.numerico, th.numerico {
            font-variant-numeric: tabular-nums;
        }

        .barra-linha {
            display: grid;
            grid-template-columns: 7rem 1fr 5.5rem;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--linha);
        }

        .barra-linha:last-child { border-bottom: none; }

        .barra-trilha {
            background: var(--papel-elevado);
            height: 0.55rem;
            border: 1px solid var(--linha);
        }

        .barra-preenchimento {
            height: 100%;
            background: var(--tinta);
        }

        .barra-valor {
            text-align: right;
            font-variant-numeric: tabular-nums;
            color: var(--texto-suave);
            font-size: 0.9rem;
        }

        .urgente {
            color: var(--erro);
            font-weight: 500;
        }

        .vazio {
            color: var(--texto-suave);
            font-size: 0.95rem;
        }

        .botao {
            display: inline-block;
            background: var(--tinta);
            color: var(--papel);
            padding: 0.6rem 1.1rem;
            text-decoration: none;
            border: none;
            font-size: 1rem;
            font-family: "Work Sans", system-ui, sans-serif;
            cursor: pointer;
        }

        .botao:hover { background: var(--tinta-forte); }

        form p { margin: 0 0 1rem; }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.3rem;
            color: var(--texto-suave);
            font-size: 0.9rem;
        }

        input[type="text"], input[type="password"], select {
            width: 100%;
            max-width: 420px;
            padding: 0.55rem 0.6rem;
            border: 1px solid var(--linha);
            background: var(--papel-elevado);
            color: var(--texto);
            font-family: inherit;
            font-size: 1rem;
        }

        input[type="checkbox"] { margin-right: 0.4rem; }

        .cartao-entrar {
            max-width: 380px;
            margin: 3rem auto 0;
            background: var(--papel-elevado);
            border: 1px solid var(--linha);
            padding: 2rem;
        }

        .erro-campo {
            color: var(--erro);
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
            outline: 2px solid var(--carimbo);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }

        @media (max-width: 540px) {
            .barra-linha {
                grid-template-columns: 5.5rem 1fr 4rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <span class="marca">Distribuidor de Protocolos</span>
        {% if user.is_authenticated %}
        <nav>
            <a href="{% url 'dashboard' %}">Painel</a>
            <a href="{% url 'lancar_protocolo' %}">Lançar protocolo</a>
            <a href="{% url 'logout' %}">Sair ({{ user.username }})</a>
        </nav>
        {% endif %}
    </header>
    <main>
        {% for mensagem in messages %}
        <div class="mensagem {{ mensagem.tags }}">{{ mensagem }}</div>
        {% endfor %}
        {% block conteudo %}{% endblock %}
    </main>
</body>
</html>
