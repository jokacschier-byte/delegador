{% load static %}<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}registrai{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{% static 'marca/favicon.ico' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'marca/favicon-32.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'marca/apple-touch-icon.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Paleta da marca registrai */
            --tinta: #16325C;
            --tinta-forte: #0E2342;
            --papel: #EEF3F9;
            --papel-elevado: #FFFFFF;
            --linha: #D7E0EA;
            --carimbo: #E8B007;
            --carimbo-fundo: #FBF0D6;
            --erro: #8B3A2E;
            --erro-fundo: #F5E7E4;
            --sucesso: #2F6E52;
            --sucesso-fundo: #E4EEE8;
            --texto: #16325C;
            --texto-suave: #5B6B80;
            --raio: 16px;
            --raio-pequeno: 10px;
            --raio-pilula: 999px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--papel);
            color: var(--texto);
            font-family: "Nunito", system-ui, sans-serif;
            font-size: 16px;
            line-height: 1.55;
        }

        h1, h2 {
            font-family: "Baloo 2", "Nunito", sans-serif;
            font-weight: 600;
            color: var(--tinta);
            margin: 0 0 1rem;
        }

        h1 { font-size: 1.6rem; }
        h2 { font-size: 1.2rem; }

        a { color: var(--tinta); }

        header {
            background: var(--tinta);
            color: var(--papel);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        header .marca {
            display: flex;
            align-items: center;
            line-height: 0;
        }

        header .marca img {
            display: block;
        }

        header nav {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        header nav a {
            color: var(--papel);
            text-decoration: none;
            opacity: 0.85;
            padding: 0.45rem 0.9rem;
            border-radius: var(--raio-pilula);
            transition: background-color 0.15s ease, opacity 0.15s ease;
        }

        header nav a:hover,
        header nav a:focus-visible {
            opacity: 1;
            background: rgba(255, 255, 255, 0.12);
        }

        header nav a.ativo {
            opacity: 1;
            background: rgba(255, 255, 255, 0.16);
            font-weight: 600;
        }

        main {
            max-width: 1040px;
            margin: 0 auto;
            padding: 1.5rem 1.25rem 3rem;
        }

        section {
            margin-bottom: 1.5rem;
        }

        .cartao {
            background: var(--papel-elevado);
            border: 1px solid var(--linha);
            border-radius: var(--raio);
            padding: 1.5rem;
        }

        .mensagem {
            border: 1px solid var(--linha);
            border-left: 4px solid var(--texto-suave);
            background: var(--papel-elevado);
            border-radius: var(--raio-pequeno);
            padding: 0.85rem 1.1rem;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .mensagem.success {
            border-left-color: var(--carimbo);
            background: var(--carimbo-fundo);
            color: var(--tinta);
        }

        .mensagem.success strong {
            font-family: "Baloo 2", "Nunito", sans-serif;
        }

        .mensagem.error {
            border-left-color: var(--erro);
            background: var(--erro-fundo);
            color: var(--erro);
        }

        .mensagem ul {
            margin: 0.5rem 0 0;
            padding-left: 1.25rem;
        }

        .mensagem a { color: inherit; }

        .chip-copiar {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.6rem;
            padding: 0.45rem 0.9rem;
            background: var(--papel-elevado);
            border: 1px dashed var(--carimbo);
            border-radius: var(--raio-pilula);
            color: var(--tinta);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        .chip-copiar:hover { background: var(--carimbo-fundo); }

        .chip-copiar.copiado {
            background: var(--sucesso-fundo);
            border-color: var(--sucesso);
            border-style: solid;
            color: var(--sucesso);
        }

        .tabela-wrap {
            overflow-x: auto;
            overflow-y: hidden;
            border-radius: var(--raio);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        th, td {
            text-align: left;
            padding: 0.7rem 0.9rem;
            border-bottom: 1px solid var(--linha);
            white-space: nowrap;
        }

        tr:last-child td { border-bottom: none; }

        th {
            color: var(--texto-suave);
            font-weight: 600;
            font-size: 0.85rem;
        }

        td.numerico, th.numerico {
            font-variant-numeric: tabular-nums;
            text-align: right;
        }

        .barra-linha {
            display: grid;
            grid-template-columns: 7rem 1fr 5.5rem;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 0;
        }

        .barra-linha + .barra-linha {
            border-top: 1px solid var(--linha);
        }

        /* .barra-trilha/.barra-preenchimento sao <span> (inline por
           padrao) -- sem "display: block" aqui, o navegador ignora
           width/height neles e a barra vira invisivel (0x0), mesmo com
           o style="width: X%" certo no HTML. Nao remover. */
        .barra-trilha {
            display: block;
            background: var(--papel);
            height: 0.6rem;
            border-radius: var(--raio-pilula);
            overflow: hidden;
        }

        .barra-preenchimento {
            display: block;
            height: 100%;
            background: var(--tinta);
            border-radius: var(--raio-pilula);
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .barra-valor {
            text-align: right;
            font-variant-numeric: tabular-nums;
            color: var(--texto-suave);
            font-size: 0.9rem;
        }

        .urgente {
            color: var(--erro);
            font-weight: 600;
        }

        .tag-ferias {
            display: inline-block;
            background: var(--linha);
            color: var(--tinta);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.1rem 0.5rem;
            border-radius: var(--raio-pilula);
            vertical-align: middle;
        }

        .pill {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: var(--raio-pilula);
            font-size: 0.78rem;
            font-weight: 600;
        }

        /* --carimbo (#E8B007) nao passa em contraste de texto sobre
           --carimbo-fundo (~1.7:1) -- usa um tom mais escuro da mesma
           familia so para a tinta do pill, mantendo o fundo dourado. */
        .pill.aberto { background: var(--carimbo-fundo); color: #8A5600; }
        .pill.concluido { background: var(--sucesso-fundo); color: var(--sucesso); }
        .pill.diligencia { background: var(--erro-fundo); color: var(--erro); }

        .tag-reingresso {
            display: inline-block;
            background: var(--linha);
            color: var(--tinta);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.1rem 0.5rem;
            border-radius: var(--raio-pilula);
            vertical-align: middle;
        }

        .link {
            background: none;
            border: none;
            color: var(--erro);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
        }

        .link:hover { text-decoration: underline; }

        .botao-texto {
            background: none;
            border: none;
            color: var(--texto-suave);
            font-size: 0.9rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            padding: 0;
        }

        .botao-texto:hover { color: var(--tinta); text-decoration: underline; }

        .linha-equipe {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 1rem;
            align-items: start;
            padding: 1rem 0;
        }

        .linha-equipe + .linha-equipe { border-top: 1px solid var(--linha); }

        /* CheckboxSelectMultiple do Django renderiza como <ul><li>, por
           isso reseta a lista aqui em vez de confiar so no flex do
           .grupos-checkbox. */
        .grupos-checkbox ul {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem 1rem;
            list-style: none;
            margin: 0.3rem 0 0;
            padding: 0;
        }

        .grupos-checkbox li { margin: 0; }

        .grupos-checkbox label {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-weight: 400;
            color: var(--texto);
            margin-bottom: 0;
        }

        @media (max-width: 540px) {
            .linha-equipe { grid-template-columns: 1fr; }
        }

        .form-status select {
            width: auto;
            max-width: none;
            padding: 0.35rem 0.5rem;
            font-size: 0.85rem;
        }

        .vazio {
            color: var(--texto-suave);
            font-size: 0.95rem;
        }

        .legenda {
            color: var(--texto-suave);
            font-size: 0.85rem;
            margin: -0.5rem 0 1rem;
        }

        .titulo-pagina {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .titulo-pagina .legenda {
            margin-bottom: 0;
        }

        .layout-formulario {
            display: flex;
            align-items: flex-start;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .cartao-peso {
            flex: 1 1 280px;
            max-width: 340px;
        }

        .cartao-peso .valor {
            font-family: "Baloo 2", "Nunito", sans-serif;
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--tinta);
            margin: 0.4rem 0 1rem;
        }

        .cartao-peso dl {
            margin: 0;
            font-size: 0.9rem;
        }

        .cartao-peso dl div {
            display: flex;
            justify-content: space-between;
            padding: 0.35rem 0;
            border-top: 1px solid var(--linha);
        }

        .cartao-peso dt { color: var(--texto-suave); }

        .cartao-peso dd {
            margin: 0;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
        }

        .botao {
            display: inline-block;
            background: var(--tinta);
            color: var(--papel);
            padding: 0.7rem 1.4rem;
            text-decoration: none;
            border: none;
            border-radius: var(--raio-pilula);
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        .botao:hover { background: var(--tinta-forte); }
        .botao:active { transform: scale(0.98); }

        form p { margin: 0 0 1.1rem; }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.35rem;
            color: var(--texto-suave);
            font-size: 0.9rem;
        }

        input[type="text"], input[type="password"], input[type="date"], select {
            width: 100%;
            max-width: 420px;
            padding: 0.65rem 0.9rem;
            border: 1px solid var(--linha);
            border-radius: var(--raio-pequeno);
            background: var(--papel);
            color: var(--texto);
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="text"]:focus, input[type="password"]:focus, input[type="date"]:focus, select:focus {
            border-color: var(--carimbo);
            background: var(--papel-elevado);
        }

        #busca-natureza { margin-bottom: 0.45rem; }

        input[type="checkbox"] {
            width: 1.15rem;
            height: 1.15rem;
            accent-color: var(--carimbo);
            cursor: pointer;
        }

        .oculto { display: none !important; }

        .campo-checkbox {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            font-weight: 600;
            color: var(--texto);
            cursor: pointer;
        }

        .cartao-entrar {
            max-width: 380px;
            margin: 3rem auto 0;
        }

        .logo-login {
            display: block;
            height: 32px;
            margin-bottom: 1.5rem;
        }

        .erro-campo {
            color: var(--erro);
            font-size: 0.85rem;
            margin-top: 0.3rem;
        }

        a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
            outline: 2px solid var(--carimbo);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }

        @media (max-width: 540px) {
            .barra-linha {
                grid-template-columns: 1fr auto;
                grid-template-areas: "nome valor" "trilha trilha";
                row-gap: 0.35rem;
            }
            .barra-linha > span:first-child { grid-area: nome; }
            .barra-trilha { grid-area: trilha; }
            .barra-valor { grid-area: valor; }
            .cartao { padding: 1.1rem; }
        }
    </style>
</head>
<body>
    <header>
        <a href="{% url 'dashboard' %}" class="marca">
            <img src="{% static 'marca/logo-horizontal-claro.png' %}" alt="registrai" height="28">
        </a>
        {% if user.is_authenticated %}
        <nav>
            <a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}ativo{% endif %}">Painel</a>
            <a href="{% url 'lancar_protocolo' %}" class="{% if request.resolver_match.url_name == 'lancar_protocolo' %}ativo{% endif %}">Lançar protocolo</a>
            <a href="{% url 'historico' %}" class="{% if request.resolver_match.url_name == 'historico' %}ativo{% endif %}">Histórico</a>
            <a href="{% url 'ferias' %}" class="{% if request.resolver_match.url_name == 'ferias' %}ativo{% endif %}">Férias</a>
            <a href="{% url 'sincronizar' %}" class="{% if request.resolver_match.url_name == 'sincronizar' %}ativo{% endif %}">Sincronizar SRI</a>
            <a href="/admin/">Configurações</a>
            <a href="{% url 'logout' %}">Sair ({{ user.username }})</a>
        </nav>
        {% endif %}
    </header>
    <main>
        {% for mensagem in messages %}
        <div class="mensagem {{ mensagem.tags }}">{{ mensagem }}</div>
        {% endfor %}
        {% block conteudo %}{% endblock %}
    </main>
</body>
</html>
