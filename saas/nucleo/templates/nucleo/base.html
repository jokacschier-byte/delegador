{% load static %}<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Distribuidor de Protocolos{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --tinta: #1E2A38;
            --tinta-forte: #141E29;
            --papel: #EDF0EC;
            --papel-elevado: #FFFFFF;
            --linha: #D8DBD2;
            --carimbo: #A6763A;
            --carimbo-fundo: #F3EADC;
            --erro: #8B3A2E;
            --erro-fundo: #F5E7E4;
            --sucesso: #2F6E52;
            --sucesso-fundo: #E4EEE8;
            --texto: #1E2A38;
            --texto-suave: #5B6472;
            --raio: 16px;
            --raio-pequeno: 10px;
            --raio-pilula: 999px;
            --sombra: 0 2px 10px rgba(30, 42, 56, 0.07), 0 1px 2px rgba(30, 42, 56, 0.06);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--papel);
            color: var(--texto);
            font-family: "Nunito", system-ui, sans-serif;
            font-size: 16px;
            line-height: 1.55;
        }

        h1, h2 {
            font-family: "Baloo 2", "Nunito", sans-serif;
            font-weight: 600;
            color: var(--tinta);
            margin: 0 0 1rem;
        }

        h1 { font-size: 1.6rem; }
        h2 { font-size: 1.2rem; }

        a { color: var(--tinta); }

        header {
            background: var(--tinta);
            color: var(--papel);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        header .marca {
            font-family: "Baloo 2", "Nunito", sans-serif;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        header nav {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        header nav a {
            color: var(--papel);
            text-decoration: none;
            opacity: 0.85;
            padding: 0.45rem 0.9rem;
            border-radius: var(--raio-pilula);
            transition: background-color 0.15s ease, opacity 0.15s ease;
        }

        header nav a:hover,
        header nav a:focus-visible {
            opacity: 1;
            background: rgba(255, 255, 255, 0.12);
        }

        header nav a.ativo {
            opacity: 1;
            background: rgba(255, 255, 255, 0.16);
            font-weight: 600;
        }

        main {
            max-width: 840px;
            margin: 0 auto;
            padding: 1.5rem 1.25rem 3rem;
        }

        section {
            margin-bottom: 1.5rem;
        }

        .cartao {
            background: var(--papel-elevado);
            border: 1px solid var(--linha);
            border-radius: var(--raio);
            box-shadow: var(--sombra);
            padding: 1.5rem;
        }

        .mensagem {
            border-left: 4px solid var(--texto-suave);
            background: var(--papel-elevado);
            border-radius: var(--raio-pequeno);
            padding: 0.85rem 1.1rem;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            box-shadow: var(--sombra);
        }

        .mensagem.success {
            border-left-color: var(--carimbo);
            background: var(--carimbo-fundo);
            color: var(--tinta);
        }

        .mensagem.success strong {
            font-family: "Baloo 2", "Nunito", sans-serif;
        }

        .mensagem.error {
            border-left-color: var(--erro);
            background: var(--erro-fundo);
            color: var(--erro);
        }

        .mensagem ul {
            margin: 0.5rem 0 0;
            padding-left: 1.25rem;
        }

        .mensagem a { color: inherit; }

        .tabela-wrap {
            overflow-x: auto;
            overflow-y: hidden;
            border-radius: var(--raio);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        th, td {
            text-align: left;
            padding: 0.7rem 0.9rem;
            border-bottom: 1px solid var(--linha);
            white-space: nowrap;
        }

        tr:last-child td { border-bottom: none; }

        th {
            color: var(--texto-suave);
            font-weight: 600;
            font-size: 0.85rem;
        }

        td.numerico, th.numerico {
            font-variant-numeric: tabular-nums;
        }

        .barra-linha {
            display: grid;
            grid-template-columns: 7rem 1fr 5.5rem;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 0;
        }

        .barra-linha + .barra-linha {
            border-top: 1px solid var(--linha);
        }

        .barra-trilha {
            background: var(--papel);
            height: 0.6rem;
            border-radius: var(--raio-pilula);
            overflow: hidden;
        }

        .barra-preenchimento {
            height: 100%;
            background: var(--tinta);
            border-radius: var(--raio-pilula);
        }

        .barra-valor {
            text-align: right;
            font-variant-numeric: tabular-nums;
            color: var(--texto-suave);
            font-size: 0.9rem;
        }

        .urgente {
            color: var(--erro);
            font-weight: 600;
        }

        .vazio {
            color: var(--texto-suave);
            font-size: 0.95rem;
        }

        .botao {
            display: inline-block;
            background: var(--tinta);
            color: var(--papel);
            padding: 0.7rem 1.4rem;
            text-decoration: none;
            border: none;
            border-radius: var(--raio-pilula);
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        .botao:hover { background: var(--tinta-forte); }
        .botao:active { transform: scale(0.98); }

        form p { margin: 0 0 1.1rem; }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.35rem;
            color: var(--texto-suave);
            font-size: 0.9rem;
        }

        input[type="text"], input[type="password"], select {
            width: 100%;
            max-width: 420px;
            padding: 0.65rem 0.9rem;
            border: 1px solid var(--linha);
            border-radius: var(--raio-pequeno);
            background: var(--papel);
            color: var(--texto);
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="text"]:focus, input[type="password"]:focus, select:focus {
            border-color: var(--carimbo);
            background: var(--papel-elevado);
        }

        #busca-natureza { margin-bottom: 0.45rem; }

        input[type="checkbox"] {
            width: 1.15rem;
            height: 1.15rem;
            accent-color: var(--carimbo);
            cursor: pointer;
        }

        .campo-checkbox {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            font-weight: 600;
            color: var(--texto);
            cursor: pointer;
        }

        .cartao-entrar {
            max-width: 380px;
            margin: 3rem auto 0;
        }

        .erro-campo {
            color: var(--erro);
            font-size: 0.85rem;
            margin-top: 0.3rem;
        }

        a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
            outline: 2px solid var(--carimbo);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }

        @media (max-width: 540px) {
            .barra-linha {
                grid-template-columns: 5.5rem 1fr 4rem;
            }
            .cartao { padding: 1.1rem; }
        }
    </style>
</head>
<body>
    <header>
        <span class="marca">Distribuidor de Protocolos</span>
        {% if user.is_authenticated %}
        <nav>
            <a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}ativo{% endif %}">Painel</a>
            <a href="{% url 'lancar_protocolo' %}" class="{% if request.resolver_match.url_name == 'lancar_protocolo' %}ativo{% endif %}">Lançar protocolo</a>
            <a href="{% url 'logout' %}">Sair ({{ user.username }})</a>
        </nav>
        {% endif %}
    </header>
    <main>
        {% for mensagem in messages %}
        <div class="mensagem {{ mensagem.tags }}">{{ mensagem }}</div>
        {% endfor %}
        {% block conteudo %}{% endblock %}
    </main>
</body>
</html>
