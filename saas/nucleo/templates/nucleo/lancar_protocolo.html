{% extends "nucleo/base.html" %}
{% block titulo %}Lançar protocolo{% endblock %}
{% block conteudo %}
<section style="max-width: 420px;">
    <h1>Lançar protocolo</h1>
    <form method="post">
        {% csrf_token %}
        {% for campo in form %}
        <p>
            <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
            {{ campo }}
            {% for erro in campo.errors %}
            <div class="erro-campo">{{ erro }}</div>
            {% endfor %}
        </p>
        {% endfor %}
        <button class="botao" type="submit">Distribuir</button>
    </form>
</section>
{% endblock %}
